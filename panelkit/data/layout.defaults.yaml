# ─────────────────────────────────────────────────────────────────────────────
# panelkit LAYOUT config — decides WHERE things go (positions, mm from top-left).
# Appearance (colors/fonts/sizes) lives in the theme; this file is geometry only.
#
# VERTICAL MODEL (how separation between elements is handled):
#   • Header and I/O elements are PINNED to absolute baselines (the *_y_mm below).
#     There is no "gap" value — the separation between two elements is simply the
#     difference of their y's (e.g. name_y_mm - rule_y_mm). To widen a gap, raise
#     the lower element's y (or lower the upper one's).
#   • Param rows are NOT pinned. They are distributed EVENLY inside the "param
#     band" (the space between the header and the I/O zone). Row-to-row spacing is
#     computed as band_height / row_count, and each row is centred in its slot.
#     So you shape param spacing by moving the band edges, not by setting row y's.
#       param band top = header.ghost_y_mm + grid.param_band_pad_mm
#       param band bot = io.chevron_y_mm   - grid.param_band_pad_mm
# Edit a number, then: python -m panelkit render <Module>
# ─────────────────────────────────────────────────────────────────────────────

panel:
  height_mm: 128.5          # standard 3U panel height; must equal units.PANEL_HEIGHT_MM (asserted)

margins:
  side_mm: 6.0              # ACTIVE: left/right inset for content (rows, I/O cells, rule spans)
  top_mm: 30.0              # reserved (not consumed yet — header uses explicit y's below)
  bottom_mm: 19.0           # reserved (not consumed yet — I/O uses explicit y's below)

screws:
  rows_y_mm: [6.0, 122.5]   # reserved metadata; real screws are VCV widgets placed in C++ at
  inset_mm: 7.5             #   the rack-grid corners (not painted into the SVG)
  keepout_r_mm: 3.4         # reserved: min clear radius around a screw (used by the evaluator)

bands:
  title_height_mm: 50.0     # reserved (header element y's below are authoritative today)
  io_height_mm: 90.0        # reserved (io element y's below are authoritative today)

grid:
  default_columns: 3        # default column count for multi-knob grids (future multi-col rows)
  min_gutter_mm: 4.0        # min edge-to-edge gap between two control hitboxes (evaluator check)
  label_clearance_mm: 4.2   # ACTIVE: vertical gap between a jack/knob edge and its label
  cell_pad_mm: 2.8          # ACTIVE: inset within a grid cell (keeps art off cell edges)
  param_band_pad_mm: 6.0    # ACTIVE: padding at top & bottom of the param band (see VERTICAL MODEL)
  label_align: column       # ACTIVE (param_grid): "column" centres each label on its column
                            #   (so the middle column lines up with the ghost / panel centre);
                            #   "pair" centres it on the dial+jack pair instead.

# Header band — absolute baselines (mm from top). Separation = difference of these.
header:
  brand_y_mm: 8.0          # TNN1T1S wordmark baseline
  rule_y_mm:  12.0          # chevron rule under the wordmark      (gap above = 4mm)
  name_y_mm:  19.0          # module name baseline                 (gap above = 7mm)
  ghost_y_mm: 24.0          # ghost-logo separator; also the TOP edge of the param band
  collapsed_name_y_mm: 5.0  # module-name baseline when brand is OFF (small top margin)

# I/O zone — absolute baselines (mm from top).
io:
  chevron_y_mm: 107.0        # bottom chevron; also the BOTTOM edge of the param band
  row_y_mm:    113.0        # jack-row centre (jack below the rule; two label lines clear the screws)
  label_gap_mm:  2.0        # io labels hug their jacks (stacked below)
