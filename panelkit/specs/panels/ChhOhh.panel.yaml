# GHOST OHCH — combined 909 hi-hats (closed + open). Each voice TUNE/DECAY/LEVEL
# + CV; DRIVE is a right-click param. Edit + re-run `python -m panelkit render ChhOhh`.
module: ChhOhh
name: GHOST OHCH
hp: 14

sections:
  - use: header               # shared Ghost header (specs/fragments.yaml)

  - kind: param_grid          # 2 voices (cols) x TUNE/DECAY/LEVEL (rows); voice in the label
    columns: 2
    params:
      - { label: CH TUNE,  param: param.closed.tune,  cv: cv.closed.tune }
      - { label: OH TUNE,  param: param.open.tune,    cv: cv.open.tune }
      - { label: CH DECAY, param: param.closed.decay, cv: cv.closed.decay }
      - { label: OH DECAY, param: param.open.decay,   cv: cv.open.decay }
      - { label: CH LEVEL, param: param.closed.level, cv: cv.closed.level }
      - { label: OH LEVEL, param: param.open.level,   cv: cv.open.level }

  - kind: io_row              # triggers, accents (LOCAL is closed-only), outputs
    cells:
      - { label: TRIG,  sub: CH, id: trig.closed.trig }
      - { label: TRIG,  sub: OH, id: trig.open.trig }
      - { label: LOCAL, id: accent.closed.local }
      - { label: TOTAL, id: accent.main.total }
      - { label: OUT,   sub: CH, id: out.closed.audio }
      - { label: OUT,   sub: OH, id: out.open.audio }
