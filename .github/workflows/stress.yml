# Ghost DSP offline stress harness (issue #17).
#
# Runs on Linux, where the toolchain is complete in a way Darwin/arm64 isn't:
#   * LeakSanitizer works (ASan's detect_leaks=1 default), so the Layer 1-3
#     ASan+UBSan run is also a real leak check -- not possible on macOS/arm64.
#   * Apple clang ships no libFuzzer or clang-tidy; the Ubuntu LLVM does.
#
# The harness is header-only against the Rack SDK, so we fetch just the SDK zip
# (its include/ + dep/include/ trees) -- no libRack, no full Rack build.
name: stress

on:
  push:
  pull_request:

env:
  # Pinned to match the SDK the harness was developed against. Bump as needed;
  # the harness only consumes header-only rack::math / dsp / simd / ProcessArgs.
  RACK_SDK_VERSION: "2.6.6"

jobs:
  stress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain (clang, clang-tidy, cppcheck)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang clang-tidy cppcheck unzip curl
          clang++ --version
          clang-tidy --version
          cppcheck --version

      - name: Fetch Rack SDK headers
        run: |
          curl -fsSL -o /tmp/rack-sdk.zip \
            "https://vcvrack.com/downloads/Rack-SDK-${RACK_SDK_VERSION}-lin-x64.zip"
          unzip -q /tmp/rack-sdk.zip -d "$HOME"
          echo "RACK_DIR=$HOME/Rack-SDK" >> "$GITHUB_ENV"
          test -f "$HOME/Rack-SDK/include/rack.hpp"

      - name: Layers 1-3 -- ASan+UBSan+LSan stress harness (all 10 voices)
        env:
          # LSan is ENABLED here (Linux default); halt on the first UBSan error.
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          mkdir -p reflect
          make -C tests/stress run RACK_DIR="$RACK_DIR" CXX=clang++ \
            2>&1 | tee reflect/stress-harness-ci.log

      - name: Static analysis -- cppcheck
        run: |
          cppcheck --enable=warning,performance,portability,style \
            --std=c++11 --error-exitcode=0 \
            -I src -I vendor/svghelper \
            src/*Engine.hpp 2>&1 | tee reflect/cppcheck-ci.log

      - name: Static analysis -- clang-tidy
        run: |
          clang-tidy src/*.cpp src/*Engine.hpp -- \
            -std=c++11 -I src -I vendor/svghelper \
            -I "$RACK_DIR/include" -I "$RACK_DIR/dep/include" \
            2>&1 | tee reflect/clang-tidy-ci.log

      - name: Layer 4 -- libFuzzer (bounded campaign, all 10 voices)
        env:
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: halt_on_error=1
        run: |
          # System clang++ on Ubuntu has libFuzzer built in; no LLVM libc++
          # rpath needed there (the Makefile's FUZZ_* defaults handle this).
          make -C tests/stress fuzz RACK_DIR="$RACK_DIR" \
            FUZZ_CXX=clang++ FUZZ_TIME=120 2>&1 | tee reflect/fuzz-ci.log

      - name: Upload stress artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stress-reports
          path: |
            reflect/stress-test-report.md
            reflect/stress-harness-ci.log
            reflect/cppcheck-ci.log
            reflect/clang-tidy-ci.log
            reflect/fuzz-ci.log
            tests/stress/crash-*
            tests/stress/leak-*
            tests/stress/timeout-*
          if-no-files-found: ignore
