# GHOST TOMS — three toms (low/mid/high) as a small drum sub-system. Each voice
# TUNE/DECAY/LEVEL + CV, independent outputs. Wider panel earns the 3x3 grammar.
# Edit + re-run `python -m panelkit render Toms`.
module: Toms
name: GHOST TOMS
hp: 20

sections:
  - use: header               # shared Ghost header (specs/fragments.yaml)

  - kind: param_grid          # 3 voices (cols) x TUNE/DECAY/LEVEL (rows); voice in the label
    columns: 3
    params:
      - { label: LOW TUNE,   param: param.low.tune,   cv: cv.low.tune }
      - { label: MID TUNE,   param: param.mid.tune,   cv: cv.mid.tune }
      - { label: HIGH TUNE,  param: param.high.tune,  cv: cv.high.tune }
      - { label: LOW DECAY,  param: param.low.decay,  cv: cv.low.decay }
      - { label: MID DECAY,  param: param.mid.decay,  cv: cv.mid.decay }
      - { label: HIGH DECAY, param: param.high.decay, cv: cv.high.decay }
      - { label: LOW LEVEL,  param: param.low.level,  cv: cv.low.level }
      - { label: MID LEVEL,  param: param.mid.level,  cv: cv.mid.level }
      - { label: HIGH LEVEL, param: param.high.level, cv: cv.high.level }

  - kind: io_row              # triggers | shared accents | independent outputs, grouped
    group_gap: 0.8
    groups:
      - - { label: TRIG, sub: LOW,  id: trig.low.trig }
        - { label: TRIG, sub: MID,  id: trig.mid.trig }
        - { label: TRIG, sub: HIGH, id: trig.high.trig }
      - - { label: LOCAL, id: accent.main.local }
        - { label: TOTAL, id: accent.main.total }
      - - { label: OUT, sub: LOW,  id: out.low.audio }
        - { label: OUT, sub: MID,  id: out.mid.audio }
        - { label: OUT, sub: HIGH, id: out.high.audio }
